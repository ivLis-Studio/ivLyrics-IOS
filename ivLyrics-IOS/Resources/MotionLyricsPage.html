/* Motion lyrics (MotionLyrics.js): boards of lyric lines placed in a 3D world
   that the camera element flies through. Every frame writes transforms,
   opacity and a few custom properties; nothing inside the viewport may
   flatten the 3D context (no opacity, filter or overflow on the camera,
   board or line elements: their opacity is passed down as --lg / --ls).
   Each word's face (font family, weight, style, tracking) is set inline from
   MotionLyricsType.js, by the script it is written in. */
.ivlyrics-motion-stage {
  position: absolute;
  z-index: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  contain: strict;
  color: #fff;
}

.ivlyrics-motion-scrim {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 75% 65% at 50% 50%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.6)),
    rgba(0, 0, 0, 0.38);
  /* Lightened by the engine in interludes, the intro and the outro. */
  will-change: opacity;
}

.ivlyrics-motion-stage[data-mood="dark"] .ivlyrics-motion-scrim,
.ivlyrics-motion-stage[data-mood="intense"] .ivlyrics-motion-scrim {
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.7)),
    rgba(0, 0, 0, 0.46);
}

/* Slow songs get a softer, filmic vignette. */
.ivlyrics-motion-stage[data-tempo="slow"] .ivlyrics-motion-scrim {
  background:
    radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.66)),
    rgba(0, 0, 0, 0.34);
}

/* A wash of the board's accent colour over the video; it changes per board. */
.ivlyrics-motion-wash {
  position: absolute;
  inset: 0;
  background: var(--iv-motion-accent, #ff5ca0);
  opacity: 0.1;
  mix-blend-mode: soft-light;
  transition: background-color 700ms ease;
}

.ivlyrics-motion-wash.is-alt {
  background: var(--iv-motion-accent-2, #5cd6ff);
}

/* A flat colour field over the video (posters): it opens from a band and cuts from colour to colour. */
.ivlyrics-motion-flood {
  position: absolute;
  inset: 0;
  background: var(--iv-motion-deep, #d01a5b);
  opacity: 0.97;
  visibility: hidden;
  transform: scaleY(0);
}

.ivlyrics-motion-flood.is-deep2 {
  background: var(--iv-motion-deep-2, #1a6fd0);
}

.ivlyrics-motion-flood.is-ink {
  background: #0b0b10;
}

.ivlyrics-motion-viewport {
  position: absolute;
  inset: 0;
  perspective: var(--iv-motion-perspective, 1100px);
  perspective-origin: 50% 50%;
}

.ivlyrics-motion-camera,
.ivlyrics-motion-board,
.ivlyrics-motion-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
}

.ivlyrics-motion-camera {
  top: 50%;
  left: 50%;
}

.ivlyrics-motion-word {
  position: absolute;
  top: 0;
  left: 0;
  font-synthesis: none;
  line-height: 1;
  white-space: pre;
  transform-origin: 0 0;
  backface-visibility: hidden;
}

/* Waiting (and sung, dimmer) lines show as outlines. */
.ivlyrics-motion-ghost {
  display: block;
  color: transparent;
  -webkit-text-stroke: max(1px, 0.024em) rgba(255, 255, 255, 0.92);
  opacity: var(--lg, 0.3);
}

/* Outlines drawn round the letters' shape by an SVG filter (MotionLyrics.js,
   createOutlines; desktop): the text is filled and the filter hollows it, so
   contours that overlap inside a letter draw no lines. A waiting line's
   outline is drawn once into a layer of its own; only its opacity changes. */
.ivlyrics-motion-ghost.is-shaped {
  color: rgba(255, 255, 255, 0.92);
  -webkit-text-stroke: 0;
  will-change: opacity;
  backface-visibility: hidden;
}

.ivlyrics-motion-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

/* Other voices (background vocals, a duet partner) are smaller: they wait as a faint fill. */
.ivlyrics-motion-word.is-voice .ivlyrics-motion-ghost {
  color: rgba(255, 255, 255, 0.85);
  -webkit-text-stroke: 0;
  opacity: calc(var(--lg, 0.3) * 0.5);
}

/* Solid type: each word flies, slams, blurs or assembles in as it is sung. */
.ivlyrics-motion-solid {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  color: #fff;
  opacity: calc(var(--ls, 1) * var(--e, 0));
  transform-origin: 50% 62%;
  /* A soft halo round the glyphs (no box), stronger over a bright picture (--lum, set by the engine where it can read the picture). */
  --halo: calc(0.1 + var(--lum, 0.3) * 0.55);
  text-shadow:
    0 0.04em 0.22em rgba(0, 0, 0, 0.32),
    0 0 0.55em rgb(0 0 0 / var(--halo));
}

.ivlyrics-motion-word[dir="rtl"] .ivlyrics-motion-solid {
  right: 0;
  left: auto;
}

/* Upright type (pillars): letters stand one under another. */
.ivlyrics-motion-word.is-upright {
  writing-mode: vertical-rl;
  text-orientation: upright;
}

/* On a colour ground (a card, a colour field) type stays white and accents turn to ink. */
.ivlyrics-motion-line.on-color {
  --iv-motion-accent: #0d0d12;
  --iv-motion-accent-2: #f6f2ea;
}

.ivlyrics-motion-char {
  display: inline-block;
  opacity: 0;
  transform-origin: 50% 70%;
}

.ivlyrics-motion-word.is-active .ivlyrics-motion-solid {
  text-shadow:
    0 0 0.32em color-mix(in srgb, var(--iv-motion-accent, #fff) 62%, transparent),
    0 0.04em 0.22em rgba(0, 0, 0, 0.32),
    0 0 0.55em rgb(0 0 0 / var(--halo));
}

/* Lite quality (the engine turns it on when frames keep coming late): one small shadow instead of
   halos and glows, and no drop-shadow filters, so moving type is cheap to draw. */
.ivlyrics-motion-stage.is-lite .ivlyrics-motion-solid,
.ivlyrics-motion-stage.is-lite .ivlyrics-motion-word.is-active .ivlyrics-motion-solid {
  text-shadow: 0 0.04em 0.16em rgba(0, 0, 0, 0.5);
}

.ivlyrics-motion-stage.is-lite .ivlyrics-motion-word,
.ivlyrics-motion-stage.is-lite .ivlyrics-motion-solid {
  filter: none !important;
}

.ivlyrics-motion-word.is-background .ivlyrics-motion-solid {
  color: rgba(255, 255, 255, 0.86);
}

/* A duet partner sings in the second accent colour. */
.ivlyrics-motion-word.is-duet .ivlyrics-motion-solid {
  color: var(--iv-motion-accent-2, #5cd6ff);
}

.accent-color .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid,
.accent-underline .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid,
.accent-spark .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid,
.accent-stamp .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid,
.accent-giant .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: var(--iv-motion-accent, #ff5ca0);
}

/* A word in handwriting against the heavy type, in the accent colour, a little askew. */
.accent-script .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: var(--iv-motion-accent, #ff5ca0);
  rotate: -4deg;
}

/* The outline turns with the solid type about the same point, so it stays under it. */
.accent-script .ivlyrics-motion-word.is-emph .ivlyrics-motion-ghost,
.accent-sticker .ivlyrics-motion-word.is-emph .ivlyrics-motion-ghost {
  rotate: -4deg;
  transform-origin: 50% 62%;
}

.accent-sticker .ivlyrics-motion-word.is-emph .ivlyrics-motion-ghost {
  rotate: -3deg;
}

.accent-outline .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: transparent;
  -webkit-text-stroke: max(1.5px, 0.045em) var(--iv-motion-accent, #ff5ca0);
  text-shadow: none;
}

/* Neon: white letters in a glow of the accent colour (the engine throbs them with the beat). */
.accent-glow .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: #fff;
  text-shadow:
    0 0 0.05em #fff,
    0 0 0.2em var(--iv-motion-accent, #ff5ca0),
    0 0 0.5em var(--iv-motion-accent, #ff5ca0);
}

/* Letters filled with a gradient of the two accent colours (top to bottom, so letters set one by one match).
   A word animated letter by letter paints the gradient on its letters only: painted on the word as well,
   it would show every letter where it rests, under the one in motion and before it is sung.
   The gradient is painted through the letters only inside the element's box: padding (taken back by a
   negative margin, so nothing moves) leaves room for a comma's tail or a slanted letter's overhang. The
   stops sit where they were on the unpadded 1em box (14% and 86%). */
.accent-gradient .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid:not(.has-letters),
.accent-gradient .ivlyrics-motion-word.is-emph .ivlyrics-motion-char {
  margin: -0.3em -0.2em;
  padding: 0.3em 0.2em;
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--iv-motion-accent-2, #5cd6ff) 80%, #fff) 0.44em, var(--iv-motion-accent, #ff5ca0) 1.16em);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: none;
}

.accent-gradient .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid.has-letters {
  text-shadow: none;
}

/* Solid block letters: the accent colour stacked behind white faces. */
.accent-extrude .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: #fff;
  text-shadow:
    0.014em 0.014em 0 var(--iv-motion-accent, #ff5ca0),
    0.028em 0.028em 0 var(--iv-motion-accent, #ff5ca0),
    0.042em 0.042em 0 var(--iv-motion-accent, #ff5ca0),
    0.056em 0.056em 0 var(--iv-motion-accent, #ff5ca0),
    0.07em 0.07em 0 var(--iv-motion-accent, #ff5ca0),
    0.084em 0.084em 0 var(--iv-motion-accent, #ff5ca0),
    0.12em 0.14em 0.18em rgba(0, 0, 0, 0.42);
}

/* A sticker: coloured letters with a thick white edge, a little askew. */
.accent-sticker .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: var(--iv-motion-accent, #ff5ca0);
  rotate: -3deg;
  text-shadow:
    0.055em 0 0 #fff, 0.048em 0.028em 0 #fff, 0.028em 0.048em 0 #fff,
    0 0.055em 0 #fff, -0.028em 0.048em 0 #fff, -0.048em 0.028em 0 #fff,
    -0.055em 0 0 #fff, -0.048em -0.028em 0 #fff, -0.028em -0.048em 0 #fff,
    0 -0.055em 0 #fff, 0.028em -0.048em 0 #fff, 0.048em -0.028em 0 #fff,
    0.04em 0.1em 0.14em rgba(0, 0, 0, 0.45);
}

/* The mark an accent draws with an emphasised word: an underline, a marker stroke, a stamp's frame or brackets. */
.ivlyrics-motion-box {
  position: absolute;
  inset: 0.02em -0.12em 0.02em;
  background: var(--iv-motion-accent, #ff5ca0);
  opacity: var(--ls, 1);
  transform: scaleX(var(--b, 0));
  transform-origin: 0 50%;
}

.ivlyrics-motion-word[dir="rtl"] .ivlyrics-motion-box {
  transform-origin: 100% 50%;
}

.ivlyrics-motion-box.is-underline {
  inset: auto -0.06em -0.06em;
  height: max(3px, 0.075em);
}

.ivlyrics-motion-box.is-mark {
  inset: 42% -0.1em 4%;
  opacity: calc(var(--ls, 1) * 0.82);
  rotate: -1.6deg;
}

/* A rubber stamp: an outlined frame that slams down around the word, square with it and clear of its letters. */
.ivlyrics-motion-box.is-stamp,
.ivlyrics-motion-word[dir="rtl"] .ivlyrics-motion-box.is-stamp {
  inset: -0.1em -0.22em -0.08em;
  border: max(2px, 0.065em) solid var(--iv-motion-accent, #ff5ca0);
  border-radius: 0.12em;
  background: none;
  opacity: calc(var(--ls, 1) * var(--b, 0));
  transform: scale(calc(1.6 - 0.6 * var(--b, 0)));
  transform-origin: 50% 50%;
}

/* A pen loop drawn round the word as it is sung (hidden until it starts: its round cap would show as a dot). */
.ivlyrics-motion-loop {
  position: absolute;
  overflow: visible;
  opacity: calc(var(--ls, 1) * min(1, var(--b, 0) * 60));
}

.ivlyrics-motion-loop path {
  fill: none;
  stroke: var(--iv-motion-accent, #ff5ca0);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: calc(1 - var(--b, 0));
}

/* Brackets: a rule either side of the word closing in on it. */
.ivlyrics-motion-box.is-bracket,
.ivlyrics-motion-word[dir="rtl"] .ivlyrics-motion-box.is-bracket {
  inset: -0.04em -0.24em -0.02em;
  border: solid var(--iv-motion-accent, #ff5ca0);
  border-width: 0 max(2px, 0.06em);
  background: none;
  opacity: calc(var(--ls, 1) * var(--b, 0));
  transform: scaleX(calc(1.6 - 0.6 * var(--b, 0)));
  transform-origin: 50% 50%;
}

/* Outlined copies stepping out from behind the word. */
.ivlyrics-motion-trail {
  position: absolute;
  top: 0;
  left: 0;
  color: transparent;
  -webkit-text-stroke: max(1px, 0.028em) var(--iv-motion-accent, #ff5ca0);
  opacity: calc(var(--ls, 1) * var(--b, 0) * (1.1 - var(--k, 1) * 0.26));
  transform: translate(calc(var(--b, 0) * var(--k, 1) * 0.085em), calc(var(--b, 0) * var(--k, 1) * 0.11em));
}

/* Spectrum: the copies are filled, in the accent colours and white, fanned out behind the word. */
.accent-spectrum .ivlyrics-motion-trail {
  -webkit-text-stroke: 0;
  color: var(--iv-motion-accent, #ff5ca0);
  opacity: calc(var(--ls, 1) * var(--b, 0));
  transform: translate(calc(var(--b, 0) * var(--k, 1) * -0.06em), calc(var(--b, 0) * var(--k, 1) * 0.075em));
}

.accent-spectrum .ivlyrics-motion-trail:nth-child(1) {
  color: var(--iv-motion-accent-2, #5cd6ff);
}

.accent-spectrum .ivlyrics-motion-trail:nth-child(2) {
  color: color-mix(in srgb, var(--iv-motion-accent, #ff5ca0) 50%, var(--iv-motion-accent-2, #5cd6ff));
}

.accent-spectrum .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: #fff;
  text-shadow: none;
}

/* Neon: a hollow tube of the accent colour glowing round its letters (the engine throbs it with the beat). */
.accent-neon .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid {
  color: transparent;
  -webkit-text-stroke: max(1.5px, 0.05em) color-mix(in srgb, var(--iv-motion-accent, #ff5ca0) 45%, #fff);
  text-shadow:
    0 0 0.08em var(--iv-motion-accent, #ff5ca0),
    0 0 0.28em var(--iv-motion-accent, #ff5ca0),
    0 0 0.7em color-mix(in srgb, var(--iv-motion-accent, #ff5ca0) 70%, transparent);
}

/* Chrome: polished metal letters with a light sweeping across them (painted through the letters like the gradient). */
@keyframes ivlyrics-motion-sheen {
  from { background-position: 0 0, 180% 0; }
  to { background-position: 0 0, -80% 0; }
}

.accent-chrome .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid:not(.has-letters),
.accent-chrome .ivlyrics-motion-word.is-emph .ivlyrics-motion-char {
  margin: -0.3em -0.2em;
  padding: 0.3em 0.2em;
  background-image:
    linear-gradient(180deg, #ffffff 0.42em, #c9ced6 0.72em, #5d636d 0.86em, #eef1f5 0.92em, #9aa1ab 1.2em),
    linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.95) 50%, transparent 60%);
  background-size: 100% 100%, 260% 100%;
  background-repeat: no-repeat;
  background-blend-mode: screen;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0.05em 0.12em rgba(0, 0, 0, 0.45));
  animation: ivlyrics-motion-sheen 2.6s linear infinite;
}

.accent-chrome .ivlyrics-motion-word.is-emph .ivlyrics-motion-solid.has-letters {
  text-shadow: none;
}

/* A seal's outer ring is dashed. */
.ivlyrics-motion-plate.is-ring.is-dash {
  border-style: dashed;
  border-width: max(2px, 0.28vh);
  border-color: rgba(255, 255, 255, 0.55);
}

/* A seal's ring: a heavy band in the accent colour round the line. */
.ivlyrics-motion-plate.is-ring.is-seal {
  border: max(4px, 0.7vh) solid var(--iv-motion-accent, #ff5ca0);
  box-shadow: 0 0 1.4vh color-mix(in srgb, var(--iv-motion-accent, #ff5ca0) 45%, transparent), inset 0 0 1.4vh color-mix(in srgb, var(--iv-motion-accent, #ff5ca0) 35%, transparent);
}

/* A slot's band and an arch's ring: flat shapes the type sits on or round. */
.ivlyrics-motion-plate {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  backface-visibility: hidden;
}

.ivlyrics-motion-plate.is-ink {
  background: rgba(11, 11, 16, 0.92);
}

.ivlyrics-motion-plate.is-band {
  background: rgba(9, 9, 14, 0.88);
}

.ivlyrics-motion-plate.is-ring {
  border: max(1.5px, 0.14vh) solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  background: none;
}

/* Outlined copies of a line tiling a word wall. */
.ivlyrics-motion-fill {
  position: absolute;
  top: 0;
  left: 0;
  font-synthesis: none;
  line-height: 1;
  white-space: pre;
  color: transparent;
  -webkit-text-stroke: max(1px, 0.02em) rgba(255, 255, 255, 0.9);
  opacity: var(--fl, 0);
  transform-origin: 0 0;
  backface-visibility: hidden;
}

.ivlyrics-motion-fill.is-shaped,
.ivlyrics-motion-echo.is-shaped {
  color: rgba(255, 255, 255, 0.9);
  -webkit-text-stroke: 0;
}

.ivlyrics-motion-spark {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1.9em;
  height: 1.9em;
  color: var(--iv-motion-accent, #ff5ca0);
  visibility: hidden;
}

.ivlyrics-motion-spark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* A thin rule drawn under the line as it is sung. */
.ivlyrics-motion-rule {
  position: absolute;
  top: 0;
  left: 0;
  height: max(1.5px, 0.12vh);
  background: rgba(255, 255, 255, 0.78);
  opacity: var(--ls, 1);
  scale: var(--r, 0) 1;
}

.type-serif .ivlyrics-motion-rule,
.has-serif .ivlyrics-motion-rule {
  background: color-mix(in srgb, var(--iv-motion-accent, #fff) 70%, #fff);
}

/* A line a composition draws as it is sung: a strip's track, a split's divider. */
.ivlyrics-motion-stroke {
  position: absolute;
  top: 0;
  left: 0;
  height: max(2px, 0.18vh);
  margin-top: calc(max(2px, 0.18vh) / -2);
  background: rgba(255, 255, 255, 0.92);
  opacity: 0;
  transform-origin: 0 50%;
}

.ivlyrics-motion-motif {
  position: absolute;
  top: 0;
  left: 0;
  color: #fff;
  visibility: hidden;
  backface-visibility: hidden;
}

.ivlyrics-motion-motif.is-accent {
  color: var(--iv-motion-accent, #ff5ca0);
}

.ivlyrics-motion-motif svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.ivlyrics-motion-echo {
  position: absolute;
  top: 0;
  left: 0;
  font-synthesis: none;
  line-height: 1;
  white-space: pre;
  color: transparent;
  -webkit-text-stroke: max(1.5px, 0.012em) rgba(255, 255, 255, 0.9);
  opacity: 0;
  transform-origin: 0 0;
}

/* A colour panel that sweeps across the screen on panel cuts. */
.ivlyrics-motion-panel {
  position: absolute;
  top: -20%;
  left: -40%;
  width: 180%;
  height: 140%;
  background: var(--iv-motion-accent, #ff5ca0);
  visibility: hidden;
  will-change: transform;
}

.ivlyrics-motion-panel.is-alt {
  background: var(--iv-motion-accent-2, #5cd6ff);
}

/* Cinematic letterbox bars for the big moments. */
.ivlyrics-motion-bars {
  position: absolute;
  inset: 0;
  visibility: hidden;
}

.ivlyrics-motion-bar {
  position: absolute;
  left: 0;
  width: 100%;
  height: 11.5%;
  background: #050507;
  transform: scaleY(0);
}

.ivlyrics-motion-bar.is-top {
  top: 0;
  transform-origin: 50% 0;
}

.ivlyrics-motion-bar.is-bottom {
  bottom: 0;
  transform-origin: 50% 100%;
}

.ivlyrics-motion-flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
}

/* Small print in the corners, like the credits of an edit. */
.ivlyrics-motion-hud {
  position: absolute;
  inset: clamp(18px, 3.2svh, 34px) clamp(20px, 3vw, 44px);
  color: rgba(255, 255, 255, 0.62);
  font-family: var(--iv-motion-ui);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
}

.ivlyrics-motion-hud > div {
  position: absolute;
  display: flex;
  /* Title and artist on one baseline, whatever script (and fallback face) each is in. */
  align-items: baseline;
  gap: 0.9em;
  max-width: 42%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ivlyrics-motion-hud-title {
  top: 0;
  left: 0;
}

.ivlyrics-motion-hud-strong {
  color: rgba(255, 255, 255, 0.9);
  font-weight: 700;
}

.ivlyrics-motion-hud-shot {
  top: 0;
  right: 0;
}

.ivlyrics-motion-hud-ai {
  padding: 0 0.45em;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 3px;
  color: #fff;
  letter-spacing: 0.08em;
}

.ivlyrics-motion-hud-time {
  bottom: 0;
  left: 0;
  font-variant-numeric: tabular-nums;
}

/* The AI direction's notice sits top left, under the title, like the app's other AI tasks.
   (The desktop app lists it with those tasks instead: MotionLyrics.js, onStatus.) */
.ivlyrics-motion-status {
  position: absolute;
  top: calc(clamp(18px, 3.2svh, 34px) + 26px);
  left: clamp(20px, 3vw, 44px);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: min(560px, calc(100% - 40px));
  padding: 7px 14px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  background: rgba(14, 14, 18, 0.62);
  color: rgba(255, 255, 255, 0.88);
  font-family: var(--iv-motion-ui);
  font-size: 12.5px;
  line-height: 1.35;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: ivlyrics-motion-status-in 260ms ease both;
}

.ivlyrics-motion-status-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--iv-motion-accent, #ff5ca0);
  animation: ivlyrics-motion-status-pulse 1.1s ease-in-out infinite;
}

.ivlyrics-motion-status.is-failed .ivlyrics-motion-status-dot {
  background: #ff6b5c;
  animation: none;
}

@keyframes ivlyrics-motion-status-in {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes ivlyrics-motion-status-pulse {
  50% { opacity: 0.35; transform: scale(0.75); }
}

.ivlyrics-motion-subtitle {
  position: absolute;
  bottom: clamp(36px, 7svh, 72px);
  left: 50%;
  max-width: min(80vw, 980px);
  color: rgba(255, 255, 255, 0.9);
  font-family: var(--iv-video-stage-translation-font-family, "Pretendard Variable"), "Pretendard Variable", Pretendard, sans-serif;
  font-size: clamp(16px, 1.6vw, 24px);
  font-weight: 500;
  line-height: 1.35;
  text-align: center;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
  opacity: 0;
  transform: translateX(-50%);
  transition: opacity 260ms ease;
}

.ivlyrics-motion-subtitle.has-text {
  opacity: 1;
}

.ivlyrics-motion-subtitle.has-text.is-resting {
  opacity: 0;
}

.ivlyrics-motion-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Interludes (MotionLyrics.js, paintInterludes): while no lyrics are on screen
   (the intro, instrumental breaks, the outro) a scene of its own plays over the
   video. Lines and outlines only: nothing opaque stands in front of the video. */
.ivlyrics-motion-interludes {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  contain: strict;
}

.ivlyrics-motion-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  color: #fff;
}

.ivlyrics-motion-scene.is-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.ivlyrics-motion-scene-title {
  max-width: 88%;
  line-height: 0.98;
  text-align: center;
  text-wrap: balance;
  text-shadow: 0 0.04em 0.3em rgba(0, 0, 0, 0.35);
  will-change: transform;
}

.ivlyrics-motion-scene-word {
  display: inline-block;
  white-space: nowrap;
}

.ivlyrics-motion-scene-letter {
  display: inline-block;
  opacity: 0;
  will-change: transform, opacity;
}

.ivlyrics-motion-scene-rule {
  width: min(46%, 520px);
  height: 2px;
  margin-top: clamp(14px, 2.4svh, 26px);
  background: linear-gradient(90deg, transparent, var(--iv-motion-accent, #fff), transparent);
  transform: scaleX(0);
}

.ivlyrics-motion-scene-artist {
  margin-top: clamp(10px, 1.8svh, 20px);
  color: rgba(255, 255, 255, 0.86);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  opacity: 0;
}

.ivlyrics-motion-scene-ring,
.ivlyrics-motion-scene-halo,
.ivlyrics-motion-scene-core,
.ivlyrics-motion-scene-motif,
.ivlyrics-motion-scene-frame,
.ivlyrics-motion-scene-sun,
.ivlyrics-motion-scene-marquee,
.ivlyrics-motion-scene-stripes {
  position: absolute;
  left: 50%;
  top: 50%;
  will-change: transform, opacity;
}

.ivlyrics-motion-scene-ring {
  border: 2px solid var(--iv-motion-accent, #fff);
  border-radius: 50%;
  box-shadow: 0 0 18px color-mix(in srgb, var(--iv-motion-accent, #fff) 55%, transparent), inset 0 0 12px color-mix(in srgb, var(--iv-motion-accent, #fff) 30%, transparent);
  opacity: 0;
}

.ivlyrics-motion-scene-halo {
  color: rgba(255, 255, 255, 0.72);
}

.ivlyrics-motion-scene-halo svg,
.ivlyrics-motion-scene-motif svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.ivlyrics-motion-scene-core {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 24px var(--iv-motion-accent, #fff);
}

.ivlyrics-motion-scene-eq {
  position: absolute;
  left: 12%;
  right: 12%;
  top: 50%;
  height: 44%;
  display: flex;
  align-items: center;
  gap: 0.5%;
  transform: translateY(-50%);
}

.ivlyrics-motion-scene-bar {
  flex: 1 1 0;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(to top, var(--iv-motion-accent-2, #fff), var(--iv-motion-accent, #fff) 50%, var(--iv-motion-accent-2, #fff));
  opacity: 0.72;
  transform: scaleY(0.02);
  will-change: transform;
}

.ivlyrics-motion-scene-axis {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 50%;
  height: 1px;
  background: rgba(255, 255, 255, 0.35);
}

.ivlyrics-motion-scene-marquee {
  width: 170%;
  display: flex;
  flex-direction: column;
}

.ivlyrics-motion-scene-row {
  line-height: 1.02;
  white-space: nowrap;
  will-change: transform;
}

.ivlyrics-motion-scene-row.is-outline {
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.75);
}

.ivlyrics-motion-scene-row.is-fill {
  color: color-mix(in srgb, var(--iv-motion-accent, #fff) 55%, transparent);
}

.ivlyrics-motion-scene-motif {
  color: rgba(255, 255, 255, 0.92);
}

.ivlyrics-motion-scene-motif.is-alt {
  color: var(--iv-motion-accent, #fff);
}

.ivlyrics-motion-scene-stripes {
  height: 260%;
}

.ivlyrics-motion-scene-band {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  will-change: transform, opacity;
}

.ivlyrics-motion-scene-band.is-a {
  background: color-mix(in srgb, var(--iv-motion-accent, #fff) 30%, transparent);
}

.ivlyrics-motion-scene-band.is-b {
  background: color-mix(in srgb, var(--iv-motion-accent-2, #fff) 24%, transparent);
}

.ivlyrics-motion-scene-band.is-w {
  background: rgba(255, 255, 255, 0.1);
}

.ivlyrics-motion-scene-frame {
  border: 2px solid rgba(255, 255, 255, 0.85);
  opacity: 0;
}

.ivlyrics-motion-scene-sun {
  top: 52%;
  border-radius: 50%;
  background: linear-gradient(to bottom, var(--iv-motion-accent, #fff), var(--iv-motion-accent-2, #fff));
  opacity: 0;
  transform-origin: 50% 100%;
  -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 9%, transparent 9% 12%);
  mask-image: repeating-linear-gradient(to bottom, #000 0 9%, transparent 9% 12%);
}

.ivlyrics-motion-scene-floor {
  position: absolute;
  left: -60%;
  top: 52%;
  width: 220%;
  height: 80%;
  overflow: hidden;
  transform: perspective(520px) rotateX(74deg);
  transform-origin: 50% 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22%);
  mask-image: linear-gradient(to bottom, transparent, #000 22%);
}

.ivlyrics-motion-scene-lines {
  position: absolute;
  inset: -90px 0 0;
  background-image:
    linear-gradient(var(--iv-motion-accent, #fff) 4px, transparent 4px),
    linear-gradient(90deg, color-mix(in srgb, var(--iv-motion-accent, #fff) 85%, transparent) 3px, transparent 3px);
  background-size: 90px 90px;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--iv-motion-accent, #fff) 60%, transparent));
  will-change: transform, opacity;
}

.ivlyrics-motion-scene-horizon {
  position: absolute;
  left: 0;
  right: 0;
  top: 52%;
  height: 2px;
  background: var(--iv-motion-accent, #fff);
  box-shadow: 0 0 22px 4px color-mix(in srgb, var(--iv-motion-accent, #fff) 60%, transparent);
}

.ivlyrics-motion-scene-count {
  position: absolute;
  left: 50%;
  top: 46%;
  display: grid;
  font-family: var(--iv-motion-ui, sans-serif);
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  transform: translate(-50%, -50%);
}

.ivlyrics-motion-scene-digits {
  grid-area: 1 / 1;
  text-align: center;
  will-change: transform, opacity;
}

.ivlyrics-motion-scene-digits.is-outline {
  color: transparent;
  -webkit-text-stroke: 2px rgba(255, 255, 255, 0.85);
}

.ivlyrics-motion-scene-digits.is-fill {
  color: var(--iv-motion-accent, #fff);
}

.ivlyrics-motion-scene-rail,
.ivlyrics-motion-scene-track {
  position: absolute;
  left: 50%;
  bottom: 24%;
  width: 56%;
  height: 2px;
  transform: translateX(-50%);
}

.ivlyrics-motion-scene-rail {
  background: rgba(255, 255, 255, 0.2);
}

.ivlyrics-motion-scene-track {
  background: rgba(255, 255, 255, 0.9);
  transform-origin: 0 50%;
}

.ivlyrics-motion-scene-wave {
  position: absolute;
  left: 0;
  top: 50%;
  overflow: visible;
  filter: drop-shadow(0 0 8px currentColor);
  will-change: transform;
}

.ivlyrics-motion-scene-wave.is-0 {
  color: rgba(255, 255, 255, 0.85);
}

.ivlyrics-motion-scene-wave.is-1 {
  color: var(--iv-motion-accent, #fff);
  opacity: 0.8;
}

.ivlyrics-motion-scene-wave.is-2 {
  color: var(--iv-motion-accent-2, #fff);
  opacity: 0.55;
}

/* The cue dots count the lyrics in: one goes out on each beat. */
.ivlyrics-motion-cue {
  position: absolute;
  left: 50%;
  top: 74%;
  display: flex;
  gap: 14px;
  opacity: 0;
  transform: translateX(-50%);
}

.ivlyrics-motion-cue-dot {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255, 255, 255, 0.9);
  border-radius: 50%;
  transition: background-color 120ms ease, box-shadow 120ms ease;
}

.ivlyrics-motion-cue-dot.is-lit {
  border-color: var(--iv-motion-accent, #fff);
  background: var(--iv-motion-accent, #fff);
  box-shadow: 0 0 14px var(--iv-motion-accent, #fff);
}

/* The mobile motion lyrics page (see MotionLyricsMobileHost.js): a transparent
   page over the app's own background. The motion rules themselves come from
   style.css; these set the page and move the small print inside the safe area. */
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#ivlyrics-motion-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.ivlyrics-motion-hud {
  inset:
    calc(var(--iv-inset-top, 0px) + 12px)
    calc(var(--iv-inset-right, 0px) + 16px)
    calc(var(--iv-inset-bottom, 0px) + 12px)
    calc(var(--iv-inset-left, 0px) + 16px);
  font-size: 10px;
}

.no-hud .ivlyrics-motion-hud {
  display: none;
}

.ivlyrics-motion-status {
  /* Top left under the title, inside the safe area. */
  top: calc(var(--iv-inset-top, 0px) + 36px);
  left: calc(var(--iv-inset-left, 0px) + 16px);
  max-width: calc(100% - 32px);
}

.no-hud .ivlyrics-motion-status {
  top: calc(var(--iv-inset-top, 0px) + 12px);
}

.ivlyrics-motion-subtitle {
  /* A phone on its side is short: the translation sits at the very bottom, clear of the lines. */
  bottom: calc(var(--iv-inset-bottom, 0px) + 10px);
  max-width: 88vw;
  font-size: clamp(13px, 1.8vw, 18px);
}

	if (root.ivLyricsMotionHost?.initialized) return;

	const preact = root.preact;
	const hooks = root.preactHooks;
	const document = root.document;
	const now = () => root.performance.now();

	// Outlines keep the plain text stroke here: the filtered outlines each take a layer of their own (MotionLyrics.js, createOutlines).
	root.ivLyricsMotionConfig = Object.freeze({ ...root.ivLyricsMotionConfig, shapedOutlines: false });

	// An AI direction of a long song can take a while; the built-in direction plays meanwhile.
	const AI_TIMEOUT_MS = 180000;
	const CACHE_TIMEOUT_MS = 4000;
	// Position reports this close to the running clock are reporting jitter: the clock eases toward them.
	const CLOCK_SNAP_MS = 120;
	const CLOCK_EASE = 0.2;
	const LABEL_KEYS = Object.freeze({
		"vinyl.presentation.motionDirecting": "directing",
		"vinyl.presentation.motionDirectFailed": "failed",
	});

	const state = {
		container: null,
		track: null,
		trackJson: "",
		eligible: false,
		playing: false,
		clock: { position: 0, at: 0, rate: 1 },
		labels: {},
		ai: false,
		background: false,
		// The viewer's comfort ({ intensity, rotation, safe }) and "direct again" counted per song.
		motion: null,
		take: { uri: "", count: 0 },
	};

	// ---------------------------------------------------------------------
	// Messages to the app, and the requests it answers
	// ---------------------------------------------------------------------

	const post = (message) => {
		try {
			const ios = root.webkit?.messageHandlers?.ivLyricsMotion;
			if (ios) ios.postMessage(message);
			else root.ivLyricsMotionNative?.postMessage?.(JSON.stringify(message));
		} catch {
			// No app is listening (a browser preview).
		}
	};

	let nextRequest = 1;
	const pending = new Map();
	const ask = (message, timeoutMs) => new Promise((resolve, reject) => {
		const id = nextRequest;
		nextRequest += 1;
		const timer = root.setTimeout(() => {
			pending.delete(id);
			reject(new Error("The app did not answer in time"));
		}, timeoutMs);
		pending.set(id, { resolve, reject, timer });
		post({ ...message, id });
	});
	/** The app's answer to a request: { ok: true, value } or { ok: false, error }. */
	const resolve = (id, result) => {
		const request = pending.get(Number(id));
		if (!request) return;
		pending.delete(Number(id));
		root.clearTimeout(request.timer);
		if (result?.ok === true) request.resolve(result.value ?? null);
		else request.reject(new Error(String(result?.error || "The request failed")));
	};

	// ---------------------------------------------------------------------
	// Playback clock
	// ---------------------------------------------------------------------

	const positionAt = (time) => {
		const clock = state.clock;
		return state.playing ? clock.position + (time - clock.at) * clock.rate : clock.position;
	};

	/** position in milliseconds (with the app's sync offset applied), playing, rate. */
	const setPlayback = ({ position, playing, rate } = {}) => {
		const time = now();
		const wasPlaying = state.playing;
		const isPlaying = playing === true;
		const speed = Number(rate) > 0 ? Number(rate) : 1;
		const current = positionAt(time);
		const reported = Number.isFinite(Number(position)) ? Number(position) : current;
		const running = wasPlaying && isPlaying && speed === state.clock.rate;
		const drift = reported - current;
		// A seek or a state change takes the report as it is; while running, small drift is eased out.
		const next = running && Math.abs(drift) <= CLOCK_SNAP_MS ? current + drift * CLOCK_EASE : reported;
		state.clock = { position: next, at: time, rate: speed };
		if (isPlaying !== wasPlaying) {
			state.playing = isPlaying;
			render();
		}
	};

	// ---------------------------------------------------------------------
	// What the Stage reads from the desktop app
	// ---------------------------------------------------------------------

	const trackIdOf = (uri) => String(uri || "").split(":").pop() || String(uri || "");
	const cacheKey = (trackId, sourceHash) => "motion-direction:" + trackId + ":" + sourceHash;

	/** The direction object in an AI answer (providers wrap it in prose or a code fence at times). */
	const parseDirection = (answer) => {
		if (answer && typeof answer === "object") return answer;
		const text = String(answer ?? "");
		const start = text.indexOf("{");
		const end = text.lastIndexOf("}");
		if (start < 0 || end <= start) throw new Error("The AI answer holds no direction");
		return JSON.parse(text.slice(start, end + 1));

		React: {
			createElement: preact.h,

			memo: (component) => component,

			useLayoutEffect: hooks.useLayoutEffect,
			useMemo: hooks.useMemo,
			useRef: hooks.useRef,
			useState: hooks.useState,
		},

			get data() {

	// The stage
	// ---------------------------------------------------------------------

				artist: track.artist,
				motion: state.motion,

	 * (cover: the album art's URL, its colours go to the AI).

	 * endTime, syllables: [{ text, startTime, endTime }], vocals?, text2? }.
	 * null clears the stage.
	 */

		const json = track ? JSON.stringify(track) : "";

		const motion = root.ivLyricsMotionLyrics;
		const lyrics = Array.isArray(track?.lyrics) ? track.lyrics : [];
		state.track = track ? {
			uri: String(track.uri || ""),
			title: String(track.title || ""),
			artist: String(track.artist || ""),
			accent: String(track.accent || ""),
			cover: String(track.cover || ""),
			language: String(track.language || ""),

			&& motion.buildModel(lyrics).length > 0;

	};

	 * labels: { directing, failed }; ai: the app can ask a provider; insets: safe area in CSS pixels; hud; background;
	 * motion: the viewer's comfort { intensity: calm | normal | wild, rotation: full | gentle | off, safe: boolean }.
	 */
	const configure = (options = {}) => {
		if (options.labels && typeof options.labels === "object") state.labels = { ...options.labels };
		if (typeof options.ai === "boolean") state.ai = options.ai;
		if (typeof options.background === "boolean") state.background = options.background;
		if (options.motion && typeof options.motion === "object") {
			const next = { intensity: String(options.motion.intensity || "normal"), rotation: String(options.motion.rotation || "full"), safe: options.motion.safe === true };
			const current = state.motion;
			if (!current || current.intensity !== next.intensity || current.rotation !== next.rotation || current.safe !== next.safe) state.motion = Object.freeze(next);
		}
		const style = document.documentElement.style;
		for (const side of ["top", "right", "bottom", "left"]) {
			const value = Number(options.insets?.[side]);
			if (Number.isFinite(value)) style.setProperty("--iv-inset-" + side, Math.max(0, value) + "px");
		}
		if (typeof options.hud === "boolean") document.documentElement.classList.toggle("no-hud", !options.hud);
		render();
	};

	const redirect = () => {
		const uri = state.track?.uri || "";
		if (!uri) return;
		state.take = { uri, count: state.take.uri === uri ? state.take.count + 1 : 1 };
		render();
	};

	// The app's background follows the motion camera
	// ---------------------------------------------------------------------

	// The engine turns the video with its camera by styling this element; the
	// app's own background view (a video or the artwork) repeats the values.
	const IDENTITY = "0|1|0|0|0";
	let backdrop = null;
	let backdropSent = IDENTITY;
	const number = (value, fallback) => {
		const parsed = parseFloat(value);
		return Number.isFinite(parsed) ? parsed : fallback;
	};
	const followBackdrop = () => {
		root.requestAnimationFrame(followBackdrop);
		if (!backdrop) return;
		const style = backdrop.style;
		const [x = "0", y = "0"] = String(style.translate || "").split(/\s+/);
		const values = state.background
			? [number(style.rotate, 0), number(style.scale, 1), number(x, 0), number(y, 0), number(String(style.filter).replace("blur(", ""), 0)]
			: [0, 1, 0, 0, 0];
		const key = values.join("|");
		if (key === backdropSent) return;
		backdropSent = key;
		post({ type: "background", rotate: values[0], scale: values[1], x: values[2], y: values[3], blur: values[4] });
	};

	/** Mounts the stage; called once the motion scripts have loaded. */
	const start = () => {
		if (state.container) return;
		state.container = document.getElementById("ivlyrics-motion-root");
		backdrop = document.createElement("div");
		backdrop.className = "ivlyrics-video-background-camera";
		backdrop.hidden = true;
		document.body.appendChild(backdrop);
		root.requestAnimationFrame(followBackdrop);
		render();
		post({ type: "ready", version: root.ivLyricsMotionDirector?.VERSION || 0 });
	};

	root.addEventListener("error", (event) => post({ type: "error", message: String(event?.message || "error") }));
	root.addEventListener("unhandledrejection", (event) => post({ type: "error", message: String(event?.reason?.message || event?.reason || "rejection") }));

		initialized: true,
		configure,
		setTrack,
		setPlayback,
		resolve,
		redirect,
		start,
		// For tests.
		positionAt,
		parseDirection,
	});
})(typeof window !== "undefined" ? window : globalThis);

// Motion lyrics type: which script each lyric word is written in, and the
// display faces that set it.
//
// Every script ivLyrics' languages use has a heavy display face (impact, the
// face nearly everything is set in), a serif for a few emphasised words, a
// rounded face for playful shots and a sturdy sans companion ("light", a

			// Exits and holds keep changing too: never the same as the shot before (a returning section aside).
			for (const [kind, weights, names, fallback] of [["exit", EXIT_WEIGHTS, EXITS, "fade"], ["hold", HOLD_WEIGHTS, HOLDS, "grow"]]) {
				if (repeats(kind)) shot[kind] = first.final[kind];
				else if (!names.includes(shot[kind]) || (previous && shot[kind] === previous[kind])) {
					shot[kind] = motionFromKit(kind, weights, previous?.[kind], fallback);
				}
			}

			tally("layout", shot.layout);
			tally("enter", shot.enter);
			tally("fx", shot.fx);
			tally("accent", shot.accent);
			history.layout.push(shot.layout);
			history.accent.push(shot.accent);
			if (!first) returns.set(key, { raw: original, final: shot });
			result.push(shot);
		});

		// Line effects: a line may hit harder than its shot only on a loud line, a few times a song.
		const refinedLines = {};
		const lineBudget = { hard: quiet ? 0 : Math.max(1, Math.floor(lines.length / 16)), punchy: Math.max(1, Math.ceil(lines.length / 10)) };
		const lineUsed = { hard: 0, punchy: 0 };
		for (const [key, entry] of Object.entries(lineDirections || {})) {
			const value = { ...entry };
			const index = Number(key);
			const shot = result.find((item) => item.from <= index && index <= item.to);
			if (HARD_FX.includes(value.fx)) {
				if (lineUsed.hard < lineBudget.hard && (energy[index] ?? 0.5) >= 0.62 && !HARD_FX.includes(shot?.fx)) lineUsed.hard += 1;
				else delete value.fx;
			} else if (PUNCHY_FX.includes(value.fx)) {
				if (lineUsed.punchy < lineBudget.punchy) lineUsed.punchy += 1;
				else delete value.fx;
			}
			if (Object.keys(value).length) refinedLines[key] = value;
		}
		return { shots: result, lines: refinedLines };
	};

	/** A complete direction made without AI, deterministic for the same song. */
	const localDirection = (model, options = {}) => {
		const lines = Array.isArray(model) ? model : [];
		const random = createRandom((Number(options.seed) >>> 0) ^ 0xA5A5A5A5);
		const energy = Array.isArray(options.energy) && options.energy.length === lines.length
			? options.energy
			: lines.map(() => 0.5);
		const tempo = options.tempo?.tempo ? options.tempo : tempoOf(lines, options.pulses);
		const mood = localMood(lines, tempo);
		const accents = ACCENT_WEIGHTS[tempo.tempo === "rap" ? "fast" : tempo.tempo] || ACCENT_WEIGHTS.mid;
		// Every return of a section gets the look it had the first time.
		const styleByKey = new Map();
		const shots = [];
		const layoutHistory = [];
		const accentHistory = [];
		const groups = groupShots(lines);
		// Its own stream, so the rest of the edit is chosen as before.
		const splitRandom = createRandom((Number(options.seed) >>> 0) ^ 0x2545F491);
		const budget = serifBudget(groups.length, lines.length);
		let serifShots = 0;
		let serifLines = 0;
		groups.forEach((shot, index) => {
			const members = lines.slice(shot.from, shot.to + 1);
			const shotEnergy = members.reduce((sum, _, offset) => sum + energy[shot.from + offset], 0) / members.length;
			const previous = shots[shots.length - 1] || null;
			const gap = index ? members[0].start - lines[shot.from - 1].end : Infinity;
			const enter = localEnter({ ...shot, index }, gap, shotEnergy, previous?.enter, tempo, random);
			const seen = shot.repeated ? styleByKey.get(shot.key) : null;
			if (seen && members.length <= MAX_LINES[seen.layout]) {
				// A returning serif section right after another serif shot keeps only its serif words.
				const back = seen.type === "serif" && previous?.type === "serif" ? { type: "impact", serif: true } : {};
				if ((back.type || seen.type) === "serif") {
					serifShots += 1;
					serifLines += members.length;
				}
				layoutHistory.push(seen.layout);
				accentHistory.push(seen.accent);
				shots.push({ ...seen, ...back, from: shot.from, to: shot.to, enter });
				return;
			}
			const traits = {
				...shot,
				split: localSplit(members, tempo, shotEnergy, splitRandom),
				build: groups[index + 1]?.chorus === true && !shot.chorus,
				voices: members.some((line, offset) => (line.backing || []).some((voice) => voice.role === "duet")
					|| (offset > 0 && singsInto(members[offset - 1], line))),
			};
			const layout = localLayout(members, shotEnergy, traits, layoutHistory, tempo, random);
			const serifRoom = previous?.type !== "serif" && serifShots < budget.shots && serifLines + members.length <= budget.lines;
			const { type, serif } = shotType(mood, tempo, layout, random, serifRoom);
			if (type === "serif") {
				serifShots += 1;
				serifLines += members.length;
			}
			const tilt = TILT[tempo.tempo] * (0.5 + shotEnergy);
			const quiet = tempo.tempo === "slow" || mood === "dreamy" || mood === "melancholic";
			const motifCount = quiet ? 1 + Math.floor(random() * 2) : 2 + Math.floor(random() * 3);
			const style = {
				from: shot.from,
				to: shot.to,
				layout,
				enter,
				fx: localFx(members, shotEnergy, tempo, random),
				accent: localAccent(accents, accentHistory, random),
				exit: localMotion(EXIT_WEIGHTS, tempo, previous?.exit, random, "fade"),
				hold: localMotion(HOLD_WEIGHTS, tempo, previous?.hold, random, "grow"),
				split: traits.split,
				type,
				serif,
				upper: (type === "impact" || type === "flex") && random() < UPPER_CHANCE[tempo.tempo],
				bars: ["hero", "wall", "crawl", "swell", "pillar"].includes(layout) && random() < (quiet ? 0.45 : 0.2),
				rule: (quiet || serif) && ["column", "hero", "tower", "stairs"].includes(layout) && random() < 0.5,
				dutch: Math.round((random() * 2 - 1) * tilt),
				motifs: motifsFor(members.map((line) => line.text + " " + (line.translation || "")).join(" "), mood, random, motifCount),
				echo: ["wall", "hero", "column", "tunnel", "tower", "stairs", "split", "swell", "carousel", "slot", "poster", "spread", "pillar"].includes(layout) && random() < 0.65 ? echoFor(members) : null,
				source: "local",
			};
			layoutHistory.push(layout);
			accentHistory.push(style.accent);
			styleByKey.set(shot.key, styleByKey.get(shot.key) || style);
			shots.push(style);
		});
		const lineDirections = {};
		lines.forEach((line, index) => {
			const held = heldWordIndex(line);
			if (held >= 0) lineDirections[index] = { emph: [held] };
		});
		// Every shot shows its accent: one without a held word emphasises its longest-sung word.
		for (const shot of shots) {
			let best = null;
			let marked = false;
			for (let index = shot.from; index <= shot.to && !marked; index += 1) {
				marked = !!lineDirections[index];
				lines[index].words.forEach((word, position) => {
					if (graphemeCount(word.text) < 2 || !/[\p{L}\p{N}]/u.test(word.text)) return;
					const sung = word.end - word.start;
					if (!best || sung > best.sung) best = { index, position, sung };
				});
			}
			if (!marked && best) lineDirections[best.index] = { emph: [best.position] };
		}
		const refined = refineShots(shots, lineDirections, lines, { ...options, tempo, energy, mood });
		return { version: VERSION, source: "local", coverage: 0, mood, tempo, palette: null, shots: refined.shots, lines: refined.lines, shapes: {} };
	};


	const toIndex = (value) => {
		const number = Number(value);
		return Number.isInteger(number) ? number : NaN;
	};

	/**
	 * Moves cuts off lines sung into each other (shots in order, covering
	 * every line): the next lines join the shot while it has room, otherwise
	 * its last lines go over to the next shot (which is split again later, at
	 * a cut between lines that are not sung into each other). A shot left
	 * empty goes.
	 */
	const keepVoicesTogether = (shots, lines) => {
		const result = shots.map((shot) => ({ ...shot }));
		const room = (shot) => (MAX_LINES[shot.layout] || 6) - (shot.to - shot.from + 1);
		for (let index = 0; index + 1 < result.length; index += 1) {
			const before = result[index];
			let after = result[index + 1];
			while (after && room(before) > 0 && singsInto(lines[before.to], lines[after.from])) {
				before.to += 1;
				after.from += 1;
				if (after.from > after.to) {
					result.splice(index + 1, 1);
					after = result[index + 1];
				}
			}
			while (after && before.to > before.from && singsInto(lines[before.to], lines[after.from])) {
				before.to -= 1;
				after.from -= 1;
			}
		}
		return result;
	};
	const hexColor = (value) => {
		const text = String(value ?? "").trim();
		return /^#[0-9a-f]{6}$/i.test(text) ? text.toLowerCase() : null;
	};

	/**
	 * The kit an AI answer built its edit on: the choices it named in "kit"
	 * and the ones its shots used, each checked against the vocabulary.
	 */
	const kitOf = (raw) => {
		const named = raw?.kit && typeof raw.kit === "object" ? raw.kit : {};
		const kit = {};
		for (const [kind, key, names] of [["layout", "layouts", LAYOUTS], ["enter", "enters", ENTERS], ["fx", "fx", FX], ["accent", "accents", ACCENTS], ["exit", "exits", EXITS], ["hold", "holds", HOLDS]]) {
			const set = new Set();
			for (const name of Array.isArray(named[key]) ? named[key] : []) if (names.includes(name)) set.add(name);
			for (const shot of Array.isArray(raw?.shots) ? raw.shots : []) if (names.includes(shot?.[kind])) set.add(shot[kind]);
			kit[kind] = set;
		}
		return kit;
	};

	/**
	 * A complete direction from an AI answer. Shots must be in order and may
	 * not overlap; lines no AI shot covers get the local director's shots.
	 */
	const normalizeDirection = (raw, model, options = {}) => {
		const lines = Array.isArray(model) ? model : [];
		const local = localDirection(lines, options);
		if (!raw || typeof raw !== "object" || Array.isArray(raw) || !lines.length) return local;
		const count = lines.length;
		const custom = shapes()?.sanitizeShapes?.(raw.shapes) || {};
		const knownMotif = (name) => !!custom[name] || shapes()?.NAMES?.includes(name);
		const localShotAt = (index) => local.shots.find((shot) => shot.from <= index && index <= shot.to);

		const aiShots = [];
		let lastTo = -1;
		for (const item of (Array.isArray(raw.shots) ? raw.shots : []).slice(0, 120)) {
			if (!item || typeof item !== "object") continue;
			let from = toIndex(item.from ?? item.lines?.[0]);
			let to = toIndex(item.to ?? item.lines?.[1] ?? item.from);
			if (!Number.isInteger(from) || !Number.isInteger(to)) continue;
			from = Math.max(from, lastTo + 1);
			to = Math.min(to, count - 1);
			if (from > to || from >= count) continue;
			const fallback = localShotAt(from);
			const layout = LAYOUTS.includes(item.layout) ? item.layout : fallback.layout;
			const motifs = (Array.isArray(item.motifs) ? item.motifs : [])
				.map((name) => String(name ?? "").trim().toLowerCase())
				.filter((name, index, list) => knownMotif(name) && list.indexOf(name) === index)
				.slice(0, MAX_SHOT_MOTIFS);
			const shotText = squash(lines.slice(from, to + 1).map((line) => line.text).join(""));
			const echoText = typeof item.echo === "string" ? item.echo.trim() : "";
			const echo = echoText && graphemeCount(echoText) <= MAX_ECHO_LENGTH && shotText.includes(squash(echoText)) ? echoText : null;
			const dutch = Number(item.dutch);
			const flag = (value, fallbackValue) => (typeof value === "boolean" ? value : fallbackValue);
			// Thin type no longer exists (it read badly over video): older answers asking for it get the heavy face.
			const type = TYPES.includes(item.type) ? item.type : item.type === "thin" ? "impact" : fallback.type;
			aiShots.push({
				from,
				to,
				layout,
				enter: ENTERS.includes(item.enter) ? item.enter : fallback.enter,
				fx: FX.includes(item.fx) ? item.fx : fallback.fx,
				accent: ACCENTS.includes(item.accent) ? item.accent : fallback.accent,
				exit: EXITS.includes(item.exit) ? item.exit : fallback.exit,
				hold: HOLDS.includes(item.hold) ? item.hold : fallback.hold,
				split: SPLITS.includes(item.split) ? item.split : fallback.split,
				interlude: INTERLUDES.includes(item.interlude) ? item.interlude : null,
				type,
				serif: flag(item.serif, item.type === "serif"),
				upper: flag(item.upper, false),
				bars: flag(item.bars, false),
				rule: flag(item.rule, false),
				dutch: Number.isFinite(dutch) ? Math.round(clamp(dutch, -12, 12)) : fallback.dutch,
				motifs: Array.isArray(item.motifs) ? motifs : fallback.motifs,
				echo,
				source: "ai",
				// The look the AI gave the shot itself (not what was filled in for it): shots in a row with one look run on.
				look: [item.layout, item.fx, item.accent, item.exit].every((value) => typeof value === "string" && value)
					? [layout, item.fx, item.accent, item.exit, item.type || ""].join("|") : "",
			});
			lastTo = to;
		}
		// Shots in a row that the AI gave one look (a chorus set line by line, the same composition, effect, accent
		// and exit) are one composition running on: they are merged as far as it holds lines and keeps them on screen
		// (not across an interlude), so the look is not broken up by the rule that no composition follows itself.
		const runs = [];
		for (const shot of aiShots) {
			const before = runs[runs.length - 1];
			const alike = !!before && before.to + 1 === shot.from && !!shot.look && shot.look === before.look;
			if (alike && shot.to - before.from + 1 <= (MAX_LINES[before.layout] || 6)
				&& lines[shot.from].start - lines[before.to].end < REST_GAP_MS && screenSpan(lines, before.from, shot.to) <= MAX_SHOT_MS) {
				before.to = shot.to;
				before.motifs = [...new Set([...before.motifs, ...shot.motifs])].slice(0, MAX_SHOT_MOTIFS);
				before.echo = before.echo || shot.echo;
				before.interlude = shot.interlude || before.interlude;
				continue;
			}
			runs.push(shot);
		}
		aiShots.splice(0, aiShots.length, ...runs);
		// Ones that cannot be merged (their lines would stay on screen too long) run on as the same composition.
		aiShots.forEach((shot, index) => {
			const before = aiShots[index - 1];
			if (!before || before.to + 1 !== shot.from || !shot.look || shot.look !== before.look) return;
			shot.continued = true;
			shot.type = before.type;
			shot.split = before.split;
		});

		// Fill what the AI left out with the local shots, clipped to the gaps.
		const filled = [];
		let cursor = 0;
		const pushLocal = (from, to) => {
			for (const shot of local.shots) {
				const start = Math.max(from, shot.from);
				const end = Math.min(to, shot.to);
				if (start <= end) filled.push({ ...shot, from: start, to: end, layout: end - start + 1 > MAX_LINES[shot.layout] ? "column" : shot.layout });
			}
		};
		for (const shot of aiShots) {
			if (shot.from > cursor) pushLocal(cursor, shot.from - 1);
			filled.push(shot);
			cursor = shot.to + 1;
		}
		if (cursor < count) pushLocal(cursor, count - 1);

		// A cut between lines sung into each other would hide the voice still
		// singing: the line moves to the shot that has room for it.
		const joined = keepVoicesTogether(filled, lines);

		// Long shots are split into compositions the layout can hold and that leave the screen within
		// MAX_SHOT_MS, away from voices sung into the next line.
		const split = [];
		for (const shot of joined) {
			const limit = MAX_LINES[shot.layout] || 6;
			for (let from = shot.from; from <= shot.to;) {
				let to = Math.min(shot.to, from + limit - 1);
				while (to > from && screenSpan(lines, from, to) > MAX_SHOT_MS) to -= 1;
				for (let end = to; to < shot.to && end > from; end -= 1) {
					if (!singsInto(lines[end], lines[end + 1])) {
						to = end;
						break;
					}
				}
				split.push({ ...shot, from, to, enter: from === shot.from ? shot.enter : "pan", continued: from !== shot.from || shot.continued === true });
				from = to + 1;
			}
		}
		// However the AI asked, serif shots stay rare.
		const shots = limitSerif(split);
		if (shots.length && shots[0].enter === "cut") shots[0].enter = "push";

		const covered = new Set();
		for (const shot of shots) {
			if (shot.source !== "ai") continue;
			for (let index = shot.from; index <= shot.to; index += 1) covered.add(index);
		}
		const lineDirections = {};
		for (const [key, value] of Object.entries(local.lines)) {
			if (!covered.has(Number(key))) lineDirections[key] = value;
		}
		for (const item of (Array.isArray(raw.lines) ? raw.lines : []).slice(0, 400)) {
			const index = toIndex(item?.n ?? item?.line ?? item?.index);
			if (!Number.isInteger(index) || index < 0 || index >= count) continue;
			const words = lines[index].words.length;
			const emph = (Array.isArray(item.emph) ? item.emph : [])
				.map(toIndex)
				.filter((value, position, list) => Number.isInteger(value) && value >= 0 && value < words && list.indexOf(value) === position)
				.slice(0, 2);
			const entry = {};
			if (emph.length) entry.emph = emph;
			if (FX.includes(item.fx)) entry.fx = item.fx;
			if (Object.keys(entry).length) lineDirections[index] = entry;
		}

		const palette = (Array.isArray(raw.palette) ? raw.palette : []).map(hexColor).filter(Boolean).slice(0, 3);
		const mood = MOODS.includes(raw.mood) ? raw.mood : local.mood;
		// However the AI chose, hits stay rare and the choices keep moving, within the kit the AI built the edit on.
		const refined = refineShots(shots, lineDirections, lines, { ...options, tempo: local.tempo, mood, kit: covered.size ? kitOf(raw) : null });
		return {
			version: VERSION,
			source: covered.size ? "ai" : "local",
			coverage: covered.size / count,
			mood,
			concept: typeof raw.concept === "string" ? raw.concept.slice(0, 200) : "",
			// Tempo is measured, never taken from the AI.
			tempo: local.tempo,
			palette: palette.length ? palette : null,
			shots: refined.shots,
			lines: refined.lines,
			shapes: custom,
		};
	};

	/**
	 * What the AI reads: numbered lines with their words, timing and
	 * translation, and what the song's structure and sound say about each:
	 * its energy (0 to 9 against the rest of the song, from options.energy),
	 * whether it belongs to a recurring block (a chorus), the earlier line it
	 * repeats, the word held over a long note and the other voices singing
	 * with it.
	 */
	const promptLines = (model, options = {}) => {
		const lines = Array.isArray(model) ? model : [];
		const energy = Array.isArray(options.energy) && options.energy.length === lines.length ? options.energy : null;
		const counts = new Map();
		for (const line of lines) counts.set(squash(line.text), (counts.get(squash(line.text)) || 0) + 1);
		const recurs = lines.map((line) => counts.get(squash(line.text)) > 1);
		const firstSeen = new Map();
		return lines.slice(0, MAX_PROMPT_LINES).map((line, index, list) => {
			const key = squash(line.text);
			if (!firstSeen.has(key)) firstSeen.set(key, index);
			const first = firstSeen.get(key);
			const held = heldWordIndex(line);
			return {
				n: index,
				words: line.words.map((word) => word.text),
				start: Math.round(line.start / 100) / 10,
				duration: Math.round((line.end - line.start) / 100) / 10,
				pause: Math.round((index ? line.start - list[index - 1].end : line.start) / 100) / 10,
				translation: typeof line.translation === "string" ? line.translation.slice(0, 80) : "",
				energy: energy && Number.isFinite(Number(energy[index])) ? Math.round(clamp(Number(energy[index]), 0, 1) * 9) : null,
				chorus: recurs[index] && (recurs[index - 1] === true || recurs[index + 1] === true),
				repeats: first < index ? first : null,
				held: held >= 0 ? held : null,
				voices: (line.backing || []).length,
			};
		});
	};

	/**
	 * The shots the song's structure suggests (groupShots: cut at sections,
	 * long pauses and the edges of recurring blocks, returning sections cut
	 * as the first time), for the AI to follow or improve on.
	 */
	const promptShots = (model) => groupShots((Array.isArray(model) ? model : []).slice(0, MAX_PROMPT_LINES))
		.map((shot) => ({ from: shot.from, to: shot.to, chorus: shot.chorus === true, repeated: shot.repeated === true }));

	const vocabulary = () => ({
		moods: [...MOODS],
		layouts: [...LAYOUTS],
		enters: [...ENTERS],
		fx: [...FX],
		accents: [...ACCENTS],
		types: [...TYPES],
		motifs: [...(shapes()?.NAMES || [])],
		exits: [...EXITS],
		splits: [...SPLITS],
		interludes: [...INTERLUDES],
		holds: [...HOLDS],
		maxLines: { ...MAX_LINES },
	});

	// What each tempo asks of the edit (part of the prompt).
	const TEMPO_NOTES = Object.freeze({
		slow: 'a slow song (ballad): let it breathe. Long, smooth camera moves (drift, fade, crane, orbit, push, pan, rise), soft entrances (glide, lift, blur, rise, wipe, open, track, wave, cascade, stretch, door), impact type with serif on the tender words (a serif shot or two at most), hero, column, corners, frame, margin, anamorph, seal, wave, crawl, carousel, constellation, stairs and swell shots, glow, gradient, underline and circle accents, rules and letterbox bars for the big lines; no whip, cut, glitch, pop, zoom or slam.',
		mid: 'a mid-tempo song: mix glides with a few bold turns (roll, twist, crane, swoop, orbit, tumble, through, hop, corkscrew, panel at section changes); lift, rise, swing, door, skew, open, cascade, ripple, flip, assemble, blur, wipe and only now and then pop; impact type, serif for a few key words; a kit drawn from compositions like lockup, chain, fill, anamorph, rails, carousel, reel, stairs, strip, split, radial, zigzag, wave, grid, constellation, corners and wall.',
		fast: 'a fast song: snappy and driving. Whip, twist, hop, corkscrew, spin, swoop, tumble and through between shots (panel or cut only at a big section change); smear, skew, slide, ripple, lift, swing, bounce, glitch and flicker words, with slam or zoom saved for the few loudest hits; reel, radial, strip, grid, collage, tower, carousel, flash, fill, lockup, marquee and bleed shots; impact type (often upper case), sticker, extrude, spark and trail accents, strong tilts.',
		rap: 'a rap or very dense song: keep up with the flow. type, slide, smear, skew, ripple, glitch and flicker words, slam only on a couple of punchlines; flash, lockup, chain, tower, grid, reel, collage, split, stairs and tunnel shots; whip, hop, twist and the odd cut between them; impact type, extrude, spark and sticker accents.'
	});

	/**
	 * The prompt an AI provider answers with a direction (normalizeDirection
	 * checks the answer). Desktop sends it through AIAddonManager; the mobile
	 * apps send it through their own providers.
	 */
	/** The album cover's colours as the prompt reads them: "#rrggbb 41%" largest share first, and how dark it is. */
	const coverFacts = (cover) => {
		const colors = (Array.isArray(cover?.colors) ? cover.colors : [])
			.map((entry) => ({ hex: hexColor(entry?.hex ?? entry), share: Number(entry?.share) }))

			.filter((cut) => Number.isInteger(cut?.from) && Number.isInteger(cut?.to))

			+ 'How the renderer works: consecutive lyric lines are grouped into SHOTS. Each shot is one composition of its lines in 3D space over the music video, and the camera flies, tilts, rolls and orbits from line to line while the video turns with it. Lines are not shown as a lyric sheet: a line\'s faint outline peeks in just before it is sung, each word appears as solid type the moment it is sung, the line keeps moving while it is held (its hold), and once the next line is under way it leaves with the shot\'s exit; at most the current line and the one before it are on screen. Every script gets matching display faces (Korean, Japanese, Chinese, Latin, Cyrillic, Arabic, Thai, Devanagari, Bengali...). You decide the grouping, the composition, the camera moves, the word animation, type, emphasis and the motifs; the renderer does the layout and timing.\n\n'
			+ 'Song: "' + String(title || '').trim() + '"' + (artist ? ' by ' + String(artist).trim() : '') + (language ? ' (language: ' + String(language) + ')' : '') + '\n'
			+ 'Tempo: ' + tempoName + (tempoFacts ? ' (' + tempoFacts + ')' : '') + ' - ' + TEMPO_NOTES[tempoName] + '\n'

			+ '\n'
			+ 'How to direct, in this order (write the first three into your answer, briefly):\n'
			+ '1. concept: one sentence, the visual idea of this edit, taken from the words and the sound (say "neon night drive: rails and grids, neon accents, whips between shots" or "a diary on a quiet night: corners and margins, handwriting accents, soft wipes"). Everything after follows it.\n'
			+ '2. kit: the song\'s own visual language, picked before any shot for its mood, tempo and concept: 6 to 9 layouts, 4 to 6 entrances, 5 to 7 fx, 3 to 5 accents, 4 to 6 exits, 3 to 5 holds and 0 to 4 motifs. Nearly every shot draws on the kit; step outside it only for the bridge or the single biggest moment. An edit feels designed when it keeps coming back to its kit, not when every shot changes everything; a kit that fights the song (dreamy waves in a metal song, slams in a lullaby) is the worst mistake.\n'

			+ ' "sections": [{"from": 0, "to": 3, "name": "verse 1"}],\n'
			+ ' "mood": "' + list(vocab.moods) + '",\n'
			+ ' "palette": ["#rrggbb", "#rrggbb"],\n'
			+ ' "shots": [{"from": 0, "to": 2, "layout": "...", "enter": "...", "fx": "...", "accent": "...", "exit": "...", "hold": "...", "split": "line", "interlude": "...", "type": "impact", "serif": false, "upper": false, "bars": false, "rule": false, "dutch": 0, "motifs": ["..."], "echo": "..."}],\n'

			+ '- layout, flat compositions: column = stacked lines the camera glides down (verses, storytelling); stairs = lines stepping down a diagonal staircase (a thought unfolding, descending or rising lines); strip = lines side by side on one long strip with a track drawn under them while the camera travels sideways (lists, journeys, a run of short lines; needs 2+ short lines); split = two columns facing each other across a centre line, lines alternating sides (duets, question and answer, contrasts; needs 2+ lines); swell = every line larger than the last (a build into the chorus, a rising plea; needs 2+ lines); zigzag = lines alternate horizontal and vertical and the screen turns 90 degrees each line (flowing, playful); spiral = 3 or 4 lines around a square while the screen turns a full circle (building, hypnotic); radial = 3+ lines radiating from a hub like spokes, the screen turning to read each (circling thoughts, obsession, festive); wall = a justified poster where short lines become huge (choruses, hooks, repeated phrases); collage = 3+ lines scattered with tilts and different sizes (busy, chaotic); hero = one or two short lines filling the screen (titles, punchlines, the biggest moments); tower = each line set in two justified rows of the same width (rap punchlines, chants, short hard lines).\n'

, frame, marquee and bleed cannot hold lines sung over each other.\n'

			+ '- hold (' + list(vocab.holds) + '): how a line keeps moving while it is held, so the screen never freezes: grow = slowly grows; drift = slides slowly along; float = its words bob gently; lean = slowly tilts; push = comes slowly toward the camera; breathe = pulses with the beat; wobble = rocks and leans like jelly (playful, drunk, dizzy lines); swivel = turns slowly in depth like a sign on a pole; still = holds still (rarely, only for short hard lines in fast songs). Slow songs always need one that moves.\n'
			+ '- split (' + list(vocab.splits) + '): how the shot breaks its lines; a line need not reach the screen all at once. line = each line whole (a very long line is still broken into phrases); phrase = lines of more than three or four words are broken into short phrases of two to four words at their natural breaks, each set, timed and leaving on its own while the camera moves from phrase to phrase (long lines, storytelling, any line too long to read at a glance); word = every word on its own, landing one after another in its own place, the line building up word by word until the next line (punchy, rhythmic lines of two to seven words, hooks, chants, fast songs; never for long dense lines or lines sung over each other). Use phrase for long lines, word now and then where the rhythm is sharp, line for short ones.\n'
			+ '- interlude (' + list(vocab.interludes) + '): only matters when an instrumental break (a long stretch with no singing) follows the shot\'s last line: the scene that plays over the video meanwhile (the lyrics are never shown in a break). pulse = rings bursting from the centre on every beat (anything with a clear beat); eq = equalizer bars dancing to the music (pop, EDM, rock); marquee = the song title in huge rows sliding past each other (anthems, confident songs); orbit = the song\'s motifs orbiting the centre (dreamy, playful, love songs); stripes = diagonal colour bands sweeping past a breathing frame (pop, funk, playful); grid = a neon grid floor rushing at the camera under a striped sun (synth, retro, electronic, night drives); count = big numbers counting down the seconds to the next lyric (build-ups, drops, tension); wave = oscilloscope waves swelling with the music (ballads, ambient, calm). Pick what fits the music in the break, and vary it from break to break.\n'

			+ '- motifs: 0 or 1 per shot (2 at a big moment), only where the lines name or imply an image (moon for moon or 月, drop for tears or rain, heart for love, flame for fire); keep a motif with its idea through the song rather than decorating every shot. Library: ' + list(vocab.motifs) + '.\n'

			+ '- echo: optional, on about one shot in three: the key word or short phrase people will remember (at most 16 characters), copied exactly from the shot\'s lyrics and shown as a giant outline behind the shot.\n'
			+ '- palette: two vivid accent colours that fit the song and its concept and read well on dark video.\n\n'
			+ 'Rules (the renderer holds the edit to them anyway):\n'
			+ '- shots: cover every line exactly once, in order, without gaps. 1 to ' + Math.max(...Object.values(max)) + ' lines each (' + limits + '). Cut where the song changes section (verse, pre-chorus, chorus, bridge), after long pauses and where the meaning turns; keep lines that answer each other together, and never cut between lines sung over each other (a duet, a call and response). Most shots hold 2 to 4 lines. Background vocals and duet parts are shown with their line automatically.\n'

					+ notes.map((note) => '- ' + note).join('\n') + '\n'

		initialized: true,
		VERSION,
		MOODS,
		TEMPOS,
		LAYOUTS,
		ENTERS,
		FX,
		LETTER_FX,
		HARD_FX,
		PUNCHY_FX,
		HARD_ENTERS,
		ACCENTS,
		TYPES,
		EXITS,
		HOLDS,
		SPLITS,
		INTERLUDES,
		MAX_SHOT_MS,

<script>
// MotionLyrics.js
// Motion lyrics: a kinetic-typography fullscreen presentation (PC).
//
// Songs with real word or character timing play as a motion-graphics edit.
// A director (MotionLyricsDirector.js, written by AI when a provider is

		return result;
	};

	const loudnessBetween = (analysis, startMs, endMs) => {
		const segments = analysis?.segments;
		if (!Array.isArray(segments) || !segments.length) return 0;
		const start = startMs / 1000;
		const end = endMs / 1000;
		let low = 0;
		let high = segments.length;
		while (low < high) {
			const middle = (low + high) >>> 1;

	const lineEnergies = (lines, analysis) => {

		if (!analysis?.segments?.length) return density;
		const loudness = ranks(lines.map((line) => loudnessBetween(analysis, line.start, Math.max(line.end, line.start + 300))));

	const pulsesInMs = (analysis) => {

	// ---------------------------------------------------------------------
	// Colour
	// ---------------------------------------------------------------------

	const parseColor = (value) => {
		const text = String(value ?? "").trim();
		let match = text.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
		if (match) {
			const hex = match[1].length === 3 ? match[1].split("").map((digit) => digit + digit).join("") : match[1];
			return [0, 2, 4].map((offset) => parseInt(hex.slice(offset, offset + 2), 16));
		}

	};
	const rgbToHsl = ([red, green, blue]) => {
		const r = red / 255;
		const g = green / 255;
		const b = blue / 255;
		const max = Math.max(r, g, b);
		const min = Math.min(r, g, b);
		const light = (max + min) / 2;
		if (max === min) return [0, 0, light];
		const delta = max - min;
		const saturation = light > 0.5 ? delta / (2 - max - min) : delta / (max + min);
		let hue;
		if (max === r) hue = (g - b) / delta + (g < b ? 6 : 0);

	/**
	 * Two accent colours that stay vivid and readable over video. The cover's
	 * colour leads: the AI palette (which favoured pinks and reds whatever the
	 * cover) only leads when the cover has no colour to give (missing, or grey),
	 * and otherwise may only add a second colour clearly apart from it.
	 */
	const paletteFrom = (accent, aiPalette) => {
		const readable = (rgb) => {
			const [hue, saturation, light] = rgbToHsl(rgb);
			return hslToHex([hue, Math.max(saturation, 0.62), clamp(light, 0.58, 0.72)]);
		};
		const colourful = (rgb) => !!rgb && rgbToHsl(rgb)[1] >= 0.08;
		const fromAi = (Array.isArray(aiPalette) ? aiPalette : []).map(parseColor).filter(colourful).map(readable);
		const cover = parseColor(accent);
		// A grey cover with no AI colour gets a cool, quiet blue rather than a loud pink.
		const first = colourful(cover) ? readable(cover) : fromAi[0] || hslToHex([0.6, 0.62, 0.68]);

	// ---------------------------------------------------------------------
	// Type: faces per script (MotionLyricsType.js) and the fonts a song needs
	// ---------------------------------------------------------------------

	const typeLib = () => root.ivLyricsMotionType;
	const shapesLib = () => root.ivLyricsMotionShapes;
	const UI_FONT = '"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif';
	const FALLBACK_SPEC = Object.freeze({ key: "fallback", script: "latin", kind: "impact", family: UI_FONT, load: null, weight: 800, style: "normal", spacing: 0, lineHeight: 1.08, scale: 1, canvasFont: "normal 800 100px sans-serif" });
	const fallbackMeasure = (text, size) => graphemesOf(text).reduce((sum, piece) => sum + (CJK_RE.test(piece) || /\p{Script=Hangul}/u.test(piece) ? 1 : 0.56), 0) * size;
	const DEFAULT_INFO = Object.freeze({ script: "latin", rtl: false, joined: false, lang: "", words: [] });

	const JOINED_FX = Object.freeze({ type: "wipe", assemble: "blur", drop: "rise", wave: "rise", track: "wipe", bounce: "pop", flicker: "wipe", cascade: "lift", ripple: "rise", swirl: "blur", rain: "rise", decode: "blur" });

	const createFontBook = () => {
		const specs = new Map();
		return (script, personality = "impact", role = "display") => {
			const key = script + "|" + personality + "|" + role;

	const casedText = (text, script, upper) => typeLib()?.casedText?.(text, script, upper) ?? String(text);

	const faceOf = (type, serif, isEmph, accent) => (isEmph && accent === "script" ? "hand" : isEmph && serif ? "serif" : type);

	const ACCENT_SCALE = Object.freeze({ giant: 1.7, script: 1.14 });

	/**
	 * The faces a direction will set, each with the characters it sets, so
	 * they can load before the song is composed.
	 */
	const fontNeeds = (model, direction, typography, extra = []) => {
		const needs = new Map();
		const font = createFontBook();
		const add = (spec, text) => {
			if (!spec?.load) return;

			for (let index = shot.from; index <= shot.to; index += 1) {

	// ---------------------------------------------------------------------
	// Composition: a line's words, then a board of lines (board-local px)
	// ---------------------------------------------------------------------

	const EMPTY_SET = new Set();
	// How far past an emphasised word (in its own em) the mark of these accents

	/** A line's words with the face, cased text and natural width each is set in. */
	const itemsOf = (line, ctx, options) => {
		const { size, emph = EMPTY_SET, emphScale = 1.3, light = false, type = "impact", serif = false, upper = false, accent = "" } = options;
		const info = ctx.typography[line.n] || DEFAULT_INFO;
		const items = line.words.map((word, index) => {
			const isEmph = emph.has(index);
			const script = info.words[index] || info.script;

			const spec = ctx.font(script, faceOf(type, serif, isEmph, accent), role);

				text,

			};
		});
		const reach = ACCENT_REACH[accent] || 0;
		if (reach) {

	const splitRows = (items, count, total) => {
		const target = total / count;
		const rows = [];
		let row = [];
		let width = 0;
		items.forEach((item, index) => {
			const remainingRows = count - rows.length - 1;
			const remainingItems = items.length - index;
			if (row.length && width + item.gap + item.width / 2 > target && remainingRows > 0 && remainingItems >= remainingRows) {
				rows.push(row);
				row = [];
				width = 0;

	const fitRows = (items, maxLength, most) => {
		const total = rowWidth(items);
		let rows = [items];
		if (total > maxLength && items.length > 1) {
			for (let count = 2; count <= Math.min(most, items.length); count += 1) {
				rows = splitRows(items, count, total);
				if (Math.max(...rows.map(rowWidth)) <= maxLength) break;

		const widest = Math.max(...rows.map(rowWidth));
		return { rows, scale: widest > maxLength ? maxLength / widest : 1 };

	const VOICE_SCALE = Object.freeze({ background: 0.56, duet: 0.8 });

	const voiceRows = (line, ctx, options, scale, maxLength) => {

			const items = voice.words.map((word, position) => {
				const script = info.backing?.[voiceIndex]?.[position] || info.script;
				const spec = ctx.font(script, options.type || "impact", role);

					spec,
					text,
					role,

	const layoutZigzag = (lines, ctx, random, look) => {

		const boxes = [];
		units.forEach((unit, index) => {
			const vertical = index % 2 === 1;

			if (!index) {
				boxes.push({ x: 0, y: 0, rot, w: unit.width, h: unit.height });
				return;
			}
			const previous = boxes[index - 1];
			const width = vertical ? unit.height : unit.width;
			const height = vertical ? unit.width : unit.height;
			const x = previous.x + previous.w / 2 + gap + width / 2;
			let y;
			if (vertical) y = turn > 0 ? previous.y - previous.h / 2 + height / 2 : previous.y + previous.h / 2 - height / 2;
			else y = turn > 0 ? previous.y + previous.h / 2 - height / 2 : previous.y - previous.h / 2 + height / 2;
			boxes.push({ x, y, rot, w: width, h: height });
		});
		return { ...placeUnits(units, boxes, lines.length), drift: { z: 70, roll: 1.2 } };
	};

	// Up to four lines around a square: the screen turns a quarter for each.
	const layoutSpiral = (lines, ctx, random, look) => {
		const direction = random() < 0.5 ? 1 : -1;
		const blocks = lines.map((line) => layoutBlock(line, ctx, blockOptions(look, line, {
			size: ctx.F * 0.72 * boostOf(line),
			maxLength: ctx.W * 0.58,
		})));
		const longest = Math.max(...blocks.map((block) => block.width));
		const thickest = Math.max(...blocks.map((block) => block.height));
		const radius = longest / 2 + thickest * 1.12;
		const places = blocks.map((block, index) => {
			const rot = direction * 90 * index;
			const inset = radius - block.height / 2;
			const angle = ((rot - 90) * Math.PI) / 180;
			return { x: Math.cos(angle) * inset, y: Math.sin(angle) * inset, z: 0, rot, block };
		});
		const frames = places.map((place) => ({ x: place.x * 0.6, y: place.y * 0.6, z: radius * 0.32, roll: place.rot }));
		return { places, frames, drift: { z: 90, roll: 2.2 * direction } };
	};

	// A justified poster: every line set to the same width, short lines huge.
	const layoutWall = (lines, ctx, random, look) => {
		const width = ctx.W * 0.72;
		const align = random() < 0.6 ? "left" : "center";
		const alternate = random() < 0.5;
		const places = [];
		let y = 0;
		lines.forEach((line, index) => {
			const options = blockOptions(look, line, { emphScale: 1.12, light: alternate && index % 2 === 1, align });
			const natural = layoutBlock(line, ctx, { ...options, size: 100, maxLength: Infinity }).leadWidth / 100;
			const size = clamp(width / Math.max(1, natural), ctx.F * 0.42, ctx.F * 2.3);
			// The natural width already fits; the slack keeps rounding from wrapping it.
			const block = layoutBlock(line, ctx, { ...options, size, maxLength: width * 1.02 });
			if (index) y += Math.min(block.size, places[index - 1].block.size) * 0.07;
