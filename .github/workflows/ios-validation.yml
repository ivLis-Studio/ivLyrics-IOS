name: iOS Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        shell: bash
        run: |
          SELECTED_XCODE="$({
            for app in /Applications/Xcode*.app; do
              if [[ -d "$app" ]]; then
                version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist" 2>/dev/null || true)"
                if [[ -n "$version" ]]; then
                  printf '%s\t%s\n' "$version" "$app"
                fi
              fi
            done
          } | ruby -rrubygems -e 'rows = STDIN.each_line.map { |line| line.chomp.split("\t", 2) }; selected = rows.max_by { |version, _| Gem::Version.new(version) }; puts selected&.last.to_s')"
          if [[ -z "$SELECTED_XCODE" ]]; then
            echo "No Xcode installation was found." >&2
            exit 1
          fi
          sudo xcode-select -s "$SELECTED_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Validate translations
        run: python3 scripts/validate-i18n.py

      - name: Validate playback, motion and provider regressions
        run: |
          python3 scripts/test-playback-regressions.py
          python3 scripts/test-karaoke-display-metadata.py
          python3 scripts/test-timeline-cache.py
          python3 scripts/test-provider-overlap.py
          python3 scripts/test-sync-load-reuse.py

      - name: Run static analyzer
        run: |
          xcodebuild \
            -project ivLyrics-IOS.xcodeproj \
            -scheme ivLyrics-IOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            analyze


      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project ivLyrics-IOS.xcodeproj \
            -scheme ivLyrics-IOS \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS device archive
        env:
          RELEASE_TAG: validation
        run: |
          export VERSION_NAME="$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' ivLyrics-IOS.xcodeproj/project.pbxproj | head -1)"
          export BUILD_NUMBER="$(sed -n 's/.*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' ivLyrics-IOS.xcodeproj/project.pbxproj | head -1)"
          scripts/build-unsigned-ipa.sh "$RUNNER_TEMP/validation"
